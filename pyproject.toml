[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-information-system-prototype"
version = "0.1.0"
description = "Minimal local information system prototype with controlled retrieval."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
info-system = "info_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"info_system.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
